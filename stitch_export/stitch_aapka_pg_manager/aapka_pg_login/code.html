<body class="bg-surface-2 text-on-surface font-body antialiased">
  <main class="min-h-[1024px] flex items-center justify-center p-6" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <section class="w-full max-w-md bg-surface border border-line rounded-xl p-8 shadow-sm flex flex-col gap-6">
      <div class="flex flex-col items-center text-center gap-3">
        <div class="w-14 h-14 rounded-lg bg-primary text-on-primary flex items-center justify-center shadow-sm">
          <span class="material-symbols-outlined text-[28px]" style="font-variation-settings: &#39;FILL&#39; 1;">bed</span>
        </div>
        <div class="flex flex-col gap-1">
          <h1 class="font-headline text-headline-lg text-ink" data-design-text-token="headline-lg">Aapka PG</h1>
          <p class="font-body text-body-md text-ink-2" data-design-text-token="body-md">Mobile number se login karo</p>
        </div>
      </div>

      <!-- Role Selector -->
      <div class="grid grid-cols-3 gap-1 p-1 rounded-md bg-surface-2 border border-line" role="tablist" aria-label="Role selector">
        <button type="button" role="tab" aria-selected="true" class="py-2 px-3 rounded-sm bg-surface text-primary shadow-sm font-label text-label-lg">
          <span data-design-text-token="label-lg">Tenant</span>
        </button>
        <button type="button" role="tab" aria-selected="false" class="py-2 px-3 rounded-sm font-label text-label-lg text-ink-2 hover:text-ink transition-colors duration-state-change">
          <span data-design-text-token="label-lg">Manager</span>
        </button>
        <button type="button" role="tab" aria-selected="false" class="py-2 px-3 rounded-sm font-label text-label-lg text-ink-2 hover:text-ink transition-colors duration-state-change">
          <span data-design-text-token="label-lg">Malik</span>
        </button>
      </div>

      <form class="flex flex-col gap-4" onsubmit="return false;">
        <label data-component-id="input-field-text" data-component-type="input-field" data-component-variant="text" class="flex flex-col gap-1.5">
          <span class="font-label text-label-sm text-ink-2" data-design-text-token="label-sm">Mobile number</span>
          <input type="tel" inputmode="numeric" placeholder="98XXXXXXXX" class="w-full px-3.5 py-2.5 rounded-md bg-surface border border-line text-ink font-body text-body-md placeholder:text-ink-2 tabular-nums focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
        </label>

        <div class="pt-2">
          <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 rounded-full bg-primary text-on-primary font-label text-label-lg shadow-sm hover:opacity-95 transition-opacity duration-state-change">
            <span data-design-text-token="label-lg">OTP bhejo</span>
          </button>
        </div>
      </form>

      <p class="text-center font-body text-body-sm text-ink-2" data-design-text-token="body-sm">
        Har kisi ko sirf apna kaam dikhega
      </p>
    </section>
  </main>
